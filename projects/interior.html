<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Projects | LuxStone Textures</title>
    
    <style>
        /* Base Critical CSS - Overridden by index.css */
        :root {
            --clr-bg: #fbfaf8;
            --clr-text-main: #1a1a1a;
            --clr-text-muted: #7a7a7a;
            --clr-accent: #cba371;
            --transition-smooth: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            --sp-md: 1.5rem;
            --sp-lg: 3rem;
            --sp-xl: 5rem;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--clr-bg); color: var(--clr-text-main); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        .navbar-placeholder { padding: 1rem var(--sp-lg); background-color: rgba(251, 250, 248, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(203, 163, 113, 0.15); position: sticky; top: 0; z-index: 100; }
        .nav-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-content .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 500; letter-spacing: 4px; text-transform: uppercase; color: var(--clr-text-main); }
        .nav-links a { text-decoration: none; color: var(--clr-text-muted); margin-left: 2.5rem; font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; transition: color var(--transition-smooth); }
    </style>

    <link rel="stylesheet" href="index.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="index.css"></noscript>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body id="page-interior">

    <!-- NAVBAR PLACEHOLDER -->
    <nav class="navbar-placeholder">
        <div class="nav-content">
            <div class="logo">LUXSTONE</div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="index.html" class="active" style="color: var(--clr-accent);">Projects</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </nav>

    <main class="projects-main">
        
        <nav class="breadcrumb">
            <a href="index.html">&larr; Projects</a> <span>/</span> <span class="current">Interior</span>
        </nav>

        <header class="page-header">
            <h1 class="page-title reveal-hidden parallax-element">INTERIOR</h1>
        </header>

        <!-- Dynamic Content Container -->
        <div id="projects-container">
            <!-- Interior sections will be injected here via JS -->
        </div>

    </main>

    <!-- FOOTER PLACEHOLDER -->
    <footer class="footer-placeholder">
        <div class="footer-content">
            <p>&copy; 2026 LuxStone Textures. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- LIGHTBOX MODAL -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-content-wrapper">
            <img class="lightbox-image" id="lightbox-img" src="" alt="Enlarged Project Image">
        </div>
    </div>

    <!-- JS dependencies -->
    <script src="index.js" defer></script>
</body>
</html>
